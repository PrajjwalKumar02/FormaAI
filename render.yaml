services:
  - type: web
    name: formaai-backend
    runtime: python
    plan: free
    autoDeploy: true
    rootDir: ai                                              # ✅ CRITICAL FIX
    buildCommand: pip install -r requirements.txt            # Now runs in ai/
    startCommand: gunicorn -c gunicorn.conf.py api.app:app   # Now runs in ai/
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"                                       # ✅ Added
      - key: AI_PROVIDER
        value: gemini                                        # ✅ Added
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: TEMPERATURE
        value: 0.3
      - key: MAX_TOKENS
        value: 4096
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.5"                                      # ✅ Added
